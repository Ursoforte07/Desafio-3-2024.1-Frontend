<!DOCTYPE html>
<html lang="PT-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Consulta de Municípios</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">        
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    
        <style>
            body {
                font-family: 'Montserrat', sans-serif;
            }
            
            .cor-engnet {
                color: #FF8D28;
            }

            .borda-header {
                border: 5px solid #FF8D28 !important;
                border-radius: 12px;
            }

            .borda-caixa {
                border: 3px solid #FF8D28 !important;
                border-radius: 12px;
            }

            .divisoria-logo {
                border-right: 5px solid #FF8D28;
                padding: 15px 20px;
                display: flex;
                align-items: center;
            }

            .caixa-scroll {
                height: 450px !important;
                overflow-y: auto;
            }

            .divisoria-coluna {
                border-right: 2px solid #FF8D28;
            }

            .divisoria-coluna:last-child {
                border-right: none;
            }

            .coluna-municipio {
                border-right: 3px solid #FF8D28;
                border-bottom: 1px solid #eee; /* Linha sutil separando as linhas */
                padding: 12px 8px;
                display: flex;
                align-items: center;
                font-size: 1.35rem;
                justify-content: center;
            }

            .coluna-municipio:nth-child(3n) {
                border-right: none;
            }

        </style>
    </head>


    <body class="bg-white">
        <div class="container my-5" style="max-width: 1200px;">
            
           <header class="d-flex align-items-stretch borda-header p-0 mb-5">
                <div class="divisoria-logo">
                    <img src="img.png" alt="Logo EngNet" style="width: 45px; height: 45px;">
                </div>
                <div class="flex-grow-1 d-flex align-items-center justify-content-center p-3">
                    <h1 class="cor-engnet fw-bold m-0 text-center display-5">Plataforma de localidades da EngNet</h1>
                </div>
            </header>

            <div class="text-center mb-5">
                <h5 class="cor-engnet fw-bold mb-3 display-6">UF</h5>
                <select id="select-uf" class="form-select mx-auto bg-secondary-subtle text-center fw-bold border-0 fs-4 py-3 shadow-sm" style="max-width: 450px; font-weight: 700;">
                    <option value="">Selecione uma UF</option>
                </select>
            </div>

            <div class="borda-caixa caixa-scroll" style="min-height: 500px;">
                <div id="lista-municipios" class="row g-0 text-center fw-bold fs-3">
                </div>
            </div>

        </div>

        <script src="script.js"></script>
    </body>


</html>
